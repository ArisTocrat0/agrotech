name: Recognition regression

on:
  push:
    branches: [improve-recognition-autonomy]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6"
          python -m pip install "transformers>=4.40,<5" "opencv-python-headless>=4.8" "numpy>=1.24" "Pillow>=10" "PyYAML>=6"
      - name: Python regressions
        run: |
          python -m unittest -v scripts.test_autolearn scripts.test_agronomy scripts.test_review scripts.test_web
      - name: UI state regressions
        run: node scripts/test_ui_state.cjs
